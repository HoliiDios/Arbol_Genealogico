<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 1000'>
  <defs>
    <pattern id='floral' width='220' height='220' patternUnits='userSpaceOnUse'>
      <rect width='220' height='220' fill='#dcccbc'/>
      <g fill='none' stroke='#2e6f9e' stroke-width='4' opacity='0.8'>
        <path d='M20 180 C60 120 90 90 150 50' />
        <path d='M130 200 C160 130 190 100 210 40' />
        <path d='M35 30 C70 60 95 95 120 130' />
      </g>
      <g fill='#2e6f9e' opacity='0.75'>
        <circle cx='42' cy='165' r='10'/><circle cx='60' cy='145' r='8'/><circle cx='84' cy='127' r='9'/>
        <circle cx='150' cy='58' r='9'/><circle cx='170' cy='44' r='8'/>
        <circle cx='118' cy='128' r='11'/><circle cx='140' cy='150' r='8'/>
        <circle cx='35' cy='36' r='8'/><circle cx='52' cy='52' r='8'/>
      </g>
    </pattern>
    <filter id='grain' x='-20%' y='-20%' width='140%' height='140%'>
      <feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch' result='noise'/>
      <feColorMatrix in='noise' type='saturate' values='0'/>
      <feComponentTransfer>
        <feFuncA type='table' tableValues='0 0.08'/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width='1600' height='1000' fill='url(#floral)'/>
  <rect width='1600' height='1000' filter='url(#grain)'/>

  <g>
    <rect x='35' y='95' width='255' height='430' rx='22' fill='#b78425' stroke='#f0d58a' stroke-width='10'/>
    <rect x='62' y='125' width='201' height='370' fill='#d8d8d8' stroke='#5b4a2f' stroke-width='8'/>
    <ellipse cx='162' cy='300' rx='70' ry='120' fill='#7f7f7f' opacity='0.75'/>
  </g>

  <g>
    <rect x='690' y='440' width='365' height='380' fill='#7b5a33' stroke='#3f2f1e' stroke-width='12'/>
    <rect x='720' y='470' width='305' height='320' fill='#d5d5d5' stroke='#4b3a27' stroke-width='8'/>
    <ellipse cx='870' cy='630' rx='98' ry='130' fill='#7a7a7a' opacity='0.78'/>
  </g>

  <g>
    <rect x='1225' y='18' width='325' height='300' fill='#6d4d2a' stroke='#3c2c1a' stroke-width='10'/>
    <rect x='1252' y='45' width='271' height='246' fill='#d0d0d0' stroke='#4d3a24' stroke-width='8'/>
    <ellipse cx='1387' cy='170' rx='92' ry='96' fill='#777' opacity='0.78'/>
  </g>

  <g transform='rotate(-6 1290 775)'>
    <rect x='1085' y='635' width='345' height='350' rx='24' fill='#b98527' stroke='#f2d889' stroke-width='10'/>
    <rect x='1114' y='664' width='287' height='292' fill='#cfd7dd' stroke='#5a4930' stroke-width='8'/>
    <ellipse cx='1258' cy='804' rx='102' ry='118' fill='#818181' opacity='0.76'/>
  </g>
</svg>
